<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PatchProof</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5EFE6;--bg-sec:#EDE3D5;--card:#FBF8F3;--line:#E1D3C5;--tx:#302321;--mut:#75645D;--ok:#48765C;--bad:#A13D42;--warn:#B17A37;--acc:#641E2E;--acc-hover:#45121F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 'Manrope',-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}
header{padding:28px 24px 12px;max-width:1000px;margin:auto}
h1{margin:0;font-size:28px;font-family:'Playfair Display',Georgia,serif;color:var(--tx)} h1 span{color:var(--acc)}
p.sub{color:var(--mut);margin:4px 0 16px}
main{max-width:1000px;margin:auto;padding:0 24px 60px}
button{background:var(--acc);color:var(--bg);border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:15px;transition:background 150ms ease}
button:hover:not(:disabled){background:var(--acc-hover)}
button:disabled{opacity:.5;cursor:wait}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:20px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font-size:24px;color:var(--acc)}.stat span{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin:16px 0;box-shadow:0 1px 3px rgba(48,35,33,0.05)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;border:1px solid}
.Critical{color:var(--bad);background:#FBEBED;border-color:#F3C3C6}.High{color:var(--warn);background:#FAF3E8;border-color:#EED7B8}
.Medium{color:var(--warn);background:#FAF3E8;border-color:#EED7B8}.Info{color:var(--mut);background:var(--bg-sec);border-color:var(--line)}
.ok{color:var(--ok);background:#EBF3EE;border-color:#BCD5C6}.bad{color:var(--bad);background:#FBEBED;border-color:#F3C3C6}
h3{margin:8px 0 4px;font-family:'Playfair Display',Georgia,serif;font-size:18px}h4{margin:14px 0 4px;color:var(--acc);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
pre{background:#221719;color:#F5EFE6;border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;margin:6px 0}
.add{color:#A7D3B5}.del{color:#F3B3B6}.hunk{color:#DDAE77}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th{background:var(--bg-sec);color:var(--acc);font-weight:700;padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.err{color:var(--bad)}
.flow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.step{flex:1;min-width:150px;background:#FAF5EE;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>Patch<span>Proof</span></h1>
  <p class="sub">Find the flaw. Prove the fix. Every finding is confirmed by a real exploit test, then re-tested after patching.</p>
  <button id="run">Run analysis on fixture/app.py</button>
</header>
<main id="out"></main>
<script>
const out = document.getElementById("out");
const btn = document.getElementById("run");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function badge(text, cls) { return el("span", "badge " + cls, text); }
function field(card, label, text) { card.append(el("h4", "", label), el("div", "", text)); }

function diffBlock(diff) {
  const pre = el("pre");
  diff.split("\n").forEach(line => {
    const cls = line.startsWith("+") && !line.startsWith("+++") ? "add"
      : line.startsWith("-") && !line.startsWith("---") ? "del"
      : line.startsWith("@@") ? "hunk" : "";
    pre.append(el("div", cls, line || " "));
  });
  return pre;
}

function render(d) {
  out.replaceChildren();
  const s = d.summary;
  const stats = el("div", "stats");
  [["Candidates", s.candidates], ["Confirmed", s.confirmed], ["False positives", s.false_positives],
   ["Fixed", s.fixed + "/" + s.confirmed], ["Regression tests", s.regressions_passed + "/" + s.regressions_total]]
    .forEach(([k, v]) => { const c = el("div", "stat"); c.append(el("b", "", String(v)), el("span", "", k)); stats.append(c); });
  out.append(stats);

  d.findings.forEach(f => {
    const c = el("div", "card");
    const top = el("div", "row");
    top.append(badge(f.severity + (f.cvss ? " " + f.cvss : ""), f.severity),
      badge(f.status === "confirmed" ? "CONFIRMED EXPLOITABLE" : "FALSE POSITIVE", f.status === "confirmed" ? "bad" : "ok"),
      el("span", "", f.id + " · " + f.cwe));
    c.append(top, el("h3", "", f.title));
    c.append(el("h4", "", "Affected code"), el("div", "", f.file + ":" + f.line + (f.end_line !== f.line ? "-" + f.end_line : "") + " in " + f.function + "()"));
    c.append(el("pre", "", f.snippet));
    field(c, "Severity rationale", f.severity_rationale);
    field(c, "Patch rationale", f.patch_rationale);
    if (f.diff) { c.append(el("h4", "", "Proposed patch")); c.append(diffBlock(f.diff)); }
    c.append(el("h4", "", "Verification"));
    const flow = el("div", "flow");
    [["Exploit before patch", f.exploit_before ? "SUCCEEDED (vulnerable)" : "failed (not exploitable)", f.exploit_before ? "bad" : "ok"],
     ["Exploit after patch", f.status === "confirmed" ? (f.exploit_after ? "STILL WORKS" : "BLOCKED") : "n/a", f.status === "confirmed" && !f.exploit_after ? "ok" : "bad"],
     ["Re-scan", f.status === "confirmed" ? (f.rescan_clean ? "pattern gone" : "still flagged") : "still flagged (benign)", f.status === "confirmed" && f.rescan_clean ? "ok" : "Info"]]
      .forEach(([k, v, cls]) => { const st = el("div", "step"); st.append(el("div", "", k), badge(v, cls)); flow.append(st); });
    c.append(flow);
    out.append(c);
  });

  const rc = el("div", "card");
  rc.append(el("h3", "", "Regression tests (expected behaviour preserved)"));
  const t = el("table");
  const hr = el("tr");
  ["Test", "Before", "After"].forEach(h => hr.append(el("th", "", h)));
  t.append(hr);
  Object.keys(d.regressions.after).forEach(name => {
    const r = el("tr");
    r.append(el("td", "", name));
    [d.regressions.before[name], d.regressions.after[name]].forEach(v => {
      const td = el("td"); td.append(badge(v ? "PASS" : "FAIL", v ? "ok" : "bad")); r.append(td);
    });
    t.append(r);
  });
  rc.append(t);
  out.append(rc);
}

btn.addEventListener("click", async () => {
  btn.disabled = true;
  btn.textContent = "Running...";
  try {
    const res = await fetch("/api/run");
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Server error");
    render(data);
  } catch (e) {
    out.replaceChildren(el("p", "err", "Error: " + e.message));
  } finally {
    btn.disabled = false;
    btn.textContent = "Run analysis on fixture/app.py";
  }
});
</script>
</body>
</html>
